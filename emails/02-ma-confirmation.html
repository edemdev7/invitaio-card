<!-- Template EmailJS « ma confirmation »
     To Email : {{to_email}}   (= ekpomachi@gmail.com)
     Reply To : {{invitee_email}}

  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #ffe4ec;border-radius:16px;padding:32px;">
        <tr>
          <td style="font-size:22px;color:#4a1030;">Elle a dit oui 💗</td>
        </tr>
        <tr>
          <td style="padding-top:20px;font-size:15px;line-height:1.9;color:#4a1030;">

            <strong>Rendez-vous :</strong> {{meeting_label}} — {{meeting_full_label}}<br />

        </tr>
        <tr>
          <td style="padding-top:22px;font-size:13px;color:#b32450;">

          </td>
        </tr>
      </table>
    </td>
