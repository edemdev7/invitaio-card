<!-- Template EmailJS « la carte pour elle »
     To Email : {{to_email}}
     Subject  : Notre rendez-vous, {{invitee_name}} 💗 -->
<table width="100%" cellpadding="0" cellspacing="0" style="background:#fff5f8;padding:32px 12px;font-family:Georgia,'Times New Roman',serif;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #ffe4ec;border-radius:20px;padding:40px 32px;text-align:center;">
        <tr>
          <td style="font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#f2567f;font-family:Arial,sans-serif;">
            Carte d'invitation
          </td>
        </tr>
        <tr>
          <td style="padding-top:18px;font-size:30px;color:#4a1030;">{{invitee_name}}</td>
        </tr>
        <tr>
          <td style="padding-top:14px;font-size:34px;">💗</td>
        </tr>
        <tr>
          <td style="padding-top:18px;font-size:19px;line-height:1.6;color:#4a1030;">
            Voici un aperçu de ce qui nous attend demain.
          </td>
        </tr>
        <tr>
          <td style="padding-top:28px;">
            <table width="100%" cellpadding="0" cellspacing="0" style="border:1px dashed #ffc9d9;border-radius:16px;background:#fff5f8;padding:24px;">
              <tr>
                <td align="center" style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#f2567f;font-family:Arial,sans-serif;">
                  Rendez-vous
                </td>
              </tr>
              <tr>
                <td align="center" style="padding-top:12px;font-size:26px;color:#4a1030;">{{meeting_label}}</td>
              </tr>
              <tr>
                <td align="center" style="padding-top:8px;font-size:14px;color:#b32450;font-family:Arial,sans-serif;">
                  {{meeting_full_label}}
                </td>
              </tr>
              <tr>
                <td align="center" style="padding-top:22px;border-top:1px solid #ffc9d9;">
                  <div style="padding-top:18px;font-size:28px;">{{activity_emoji}}</div>
                  <div style="padding-top:8px;font-size:17px;color:#4a1030;">{{activity_title}}</div>
                  <div style="padding-top:10px;font-size:14px;line-height:1.6;color:#b32450;font-family:Arial,sans-serif;">
                    {{activity_detail}}
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding-top:28px;font-size:15px;line-height:1.7;color:#b32450;font-family:Arial,sans-serif;">
            Je m'occupe de tout le reste. Toi, tu n'as plus qu'à venir.
          </td>
        </tr>
        <tr>
          <td style="padding-top:26px;font-size:20px;color:#4a1030;">— {{host_name}}</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
